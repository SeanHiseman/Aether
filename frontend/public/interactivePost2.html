         // Quiz questions
         const quizData = {

         };
 
         // Create mixed quiz from all categories
         function createMixedQuiz() {
             const mixed = [];
             Object.values(quizData).forEach(category => {
                 mixed.push(...category);
             });
             return mixed.sort(() => Math.random() - 0.5).slice(0, 15);
         }
 
         // Current quiz state
         let currentQuiz = [];
         let currentQuestion = 0;
         let score = 0;
         let answeredQuestions = [];
 
         // Progress tracking
         let progress = JSON.parse(localStorage.getItem('frenchProgress') || '{}');
 
         function showSection(sectionName) {
             // Hide all sections
             document.querySelectorAll('.section').forEach(section => {
                 section.classList.remove('active');
             });
             
             // Show selected section
             document.getElementById(sectionName).classList.add('active');
             
             // Update nav buttons
             document.querySelectorAll('.nav-btn').forEach(btn => {
                 btn.classList.remove('active');
             });
             event.target.classList.add('active');
 
             // Update progress display if viewing progress section
             if (sectionName === 'progress') {
                 updateProgressDisplay();
             }
         }
 
         function showTutorial(tutorialName) {
             const tutorial = tutorials[tutorialName];
             if (!tutorial) return;
 
             const tutorialData = document.getElementById('tutorialData');
             tutorialData.innerHTML = `
                 <h2>${tutorial.title}</h2>
                 <div class=&quot;tutorial-content&quot;>
                     ${tutorial.content.map(item => `
                         <div class=&quot;vocab-item&quot;>
                             <div>
                                 <div class=&quot;french-word&quot;>${item.french}</div>
                                 <div class=&quot;pronunciation&quot;>[${item.pronunciation}]</div>
                             </div>
                             <div class=&quot;english-word&quot;>${item.english}</div>
                         </div>
                     `).join('')}
                 </div>
             `;
 
             showSection('tutorialContent');
         }
 
         function startQuiz(quizType) {
             if (quizType === 'mixed') {
                 currentQuiz = createMixedQuiz();
             } else {
                 currentQuiz = [...quizData[quizType]].sort(() => Math.random() - 0.5);
             }
             
             currentQuestion = 0;
             score = 0;
             answeredQuestions = [];
             
             document.getElementById('totalQuestions').textContent = currentQuiz.length;
             document.getElementById('scoreDisplay').textContent = `Score: 0/${currentQuiz.length}`;
             document.getElementById('progressBar').style.width = '0%';
             
             displayQuestion();
             showSection('quizContent');
         }
 
         function displayQuestion() {
             if (currentQuestion >= currentQuiz.length) {
                 finishQuiz();
                 return;
             }
 
             const question = currentQuiz[currentQuestion];
             document.getElementById('questionNumber').textContent = currentQuestion + 1;
             document.getElementById('questionText').textContent = question.question;
             
             const optionsContainer = document.getElementById('optionsContainer');
             optionsContainer.innerHTML = '';
             
             question.options.forEach((option, index) => {
                 const optionDiv = document.createElement('div');
                 optionDiv.className = 'option';
                 optionDiv.textContent = option;
                 optionDiv.onclick = () => selectAnswer(index);
                 optionsContainer.appendChild(optionDiv);
             });
             
             document.getElementById('nextBtn').style.display = 'none';
             document.getElementById('finishBtn').style.display = 'none';
         }
 
         function selectAnswer(selectedIndex) {
             const question = currentQuiz[currentQuestion];
             const options = document.querySelectorAll('.option');
             
             // Disable all options
             options.forEach(option => {
                 option.style.pointerEvents = 'none';
             });
             
             // Show correct/incorrect
             options[question.correct].classList.add('correct');
             if (selectedIndex !== question.correct) {
                 options[selectedIndex].classList.add('incorrect');
             } else {
                 score++;
             }
             
             answeredQuestions.push({
                 question: question.question,
                 selected: selectedIndex,
                 correct: question.correct,
                 isCorrect: selectedIndex === question.correct
             });
             
             // Update score display
             document.getElementById('scoreDisplay').textContent = `Score: ${score}/${currentQuiz.length}`;
             
             // Update progress bar
             const progress = ((currentQuestion + 1) / currentQuiz.length) * 100;
             document.getElementById('progressBar').style.width = progress + '%';
             
             // Show next button or finish button
             if (currentQuestion < currentQuiz.length - 1) {
                 document.getElementById('nextBtn').style.display = 'block';
             } else {
                 document.getElementById('finishBtn').style.display = 'block';
             }
         }
 
         function nextQuestion() {
             currentQuestion++;
             displayQuestion();
         }
 
         function finishQuiz() {
             const percentage = Math.round((score / currentQuiz.length) * 100);
             const quizType = getCurrentQuizType();
             
             // Save progress
             if (!progress[quizType]) progress[quizType] = [];
             progress[quizType].push({
                 date: new Date().toLocaleDateString(),
                 score: score,
                 total: currentQuiz.length,
                 percentage: percentage
             });
             
             localStorage.setItem('frenchProgress', JSON.stringify(progress));
             
             // Show results
             let message = '';
             if (percentage >= 90) {
                 message = '🎉 Excellent! You\'re mastering French!';
             } else if (percentage >= 70) {
                 message = '👍 Great job! Keep practicing!';
             } else if (percentage >= 50) {
                 message = '👌 Good effort! Review the tutorials and try again.';
             } else {
                 message = '📚 Keep studying! Practice makes perfect.';
             }
             
             alert(`Quiz Complete!\n\nScore: ${score}/${currentQuiz.length} (${percentage}%)\n${message}`);
             
             showSection('quizzes');
         }
 
         function getCurrentQuizType() {
             // Try to determine quiz type from current questions
             if (currentQuiz.length > 10) return 'mixed';
             
             const firstQuestion = currentQuiz[0].question.toLowerCase();
             if (firstQuestion.includes('hello') || firstQuestion.includes('thank')) return 'greetings';
             if (firstQuestion.includes('say') &amp;&amp; (firstQuestion.includes(&quot;'&quot;) || firstQuestion.includes('number'))) return 'numbers';
             if (firstQuestion.includes('mother') || firstQuestion.includes('family')) return 'family';
             if (firstQuestion.includes('red') || firstQuestion.includes('color')) return 'colors';
             
             return 'mixed';
         }
 
         function updateProgressDisplay() {
             const progressDisplay = document.getElementById('progressDisplay');
             
             if (Object.keys(progress).length === 0) {
                 progressDisplay.innerHTML = '<p>No quiz attempts yet. Start taking quizzes to track your progress!</p>';
                 return;
             }
             
             let html = '';
             Object.entries(progress).forEach(([quizType, attempts]) => {
                 const latest = attempts[attempts.length - 1];
                 const average = Math.round(attempts.reduce((sum, attempt) => sum + attempt.percentage, 0) / attempts.length);
                 
                 html += `
                     <div class=&quot;vocab-item&quot;>
                         <div>
                             <div class=&quot;french-word&quot;>${quizType.charAt(0).toUpperCase() + quizType.slice(1)} Quiz</div>
                             <div class=&quot;pronunciation&quot;>Attempts: ${attempts.length} | Average: ${average}%</div>
                         </div>
                         <div class=&quot;english-word&quot;>Latest: ${latest.percentage}%</div>
                     </div>
                 `;
             });
             
             progressDisplay.innerHTML = html;
         }
 
         function showQuiz(quizType) {
             startQuiz(quizType);
         }
 
         // Initialize the app
         document.addEventListener('DOMContentLoaded', function() {
             showSection('home');
         });
     </script>
