<html><head></head><body><div class="content-block code-block" data-blockid="c3e76942-542d-4b53-b9ab-8cbbe00d7916" data-code="<!DOCTYPE html>
 <html lang=&quot;en&quot;>
 <head>
     <meta charset=&quot;UTF-8&quot;>
     <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
     <title>Neural Network Interactive Demo</title>
     <style>
         :root {
             --border: #3e3f41;
             --darkest: #0f0f0f;
             --dark: #232527;
             --light: #737484;
             --lightest: #dddddd;
             --accent: #4a9eff;
             --positive: #52c41a;
             --negative: #ff4d4f;
         }
 
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
         }
 
         body {
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
             background-color: var(--darkest);
             color: var(--lightest);
             min-height: 100vh;
             padding: 2vw;
             line-height: 1.6;
             font-size: calc(14px + 0.2vw);
         }
 
         .container {
             max-width: 1200px;
             margin: 0 auto;
         }
 
         h1 {
             text-align: center;
             margin-bottom: 3vh;
             color: var(--lightest);
             font-size: calc(1.5em + 1.5vw);
         }
 
         h2 {
             font-size: calc(1.2em + 0.5vw);
             margin-bottom: 1vh;
         }
 
         .tutorial-section {
             background-color: var(--dark);
             border: 1px solid var(--border);
             border-radius: 8px;
             padding: calc(15px + 1vw);
             margin-bottom: 3vh;
         }
 
         .tutorial-section p {
             font-size: calc(14px + 0.3vw);
             margin-bottom: 0.5em;
         }
 
         .neural-network-container {
             display: flex;
             justify-content: center;
             align-items: center;
             min-height: 50vh;
             background-color: var(--darkest);
             border: 1px solid var(--border);
             border-radius: 8px;
             padding: calc(20px + 2vw);
             position: relative;
             overflow: hidden;
         }
 
         .layers-wrapper {
             display: flex;
             gap: calc(50px + 8vw);
             align-items: center;
         }
 
         .layer {
             display: flex;
             flex-direction: column;
             justify-content: center;
             align-items: center;
             gap: calc(20px + 2vh);
             z-index: 10;
         }
 
         .neuron {
             width: calc(40px + 3vw);
             height: calc(40px + 3vw);
             border-radius: 50%;
             background-color: var(--dark);
             border: 3px solid var(--accent);
             display: flex;
             align-items: center;
             justify-content: center;
             font-weight: bold;
             font-size: calc(11px + 0.4vw);
             position: relative;
             cursor: pointer;
             transition: all 0.3s ease;
             z-index: 20;
         }
 
         .neuron:hover {
             transform: scale(1.1);
             box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
         }
 
         .neuron.active {
             background-color: var(--accent);
             color: var(--darkest);
             box-shadow: 0 0 30px var(--accent);
         }
 
         .controls {
             margin-top: 3vh;
             display: flex;
             gap: 2vw;
             flex-wrap: wrap;
             justify-content: center;
         }
 
         .input-control {
             display: flex;
             align-items: center;
             gap: calc(5px + 0.5vw);
             background-color: var(--dark);
             padding: calc(8px + 0.5vw) calc(15px + 1vw);
             border-radius: 6px;
             border: 1px solid var(--border);
             font-size: calc(13px + 0.3vw);
         }
 
         input[type=&quot;range&quot;] {
             width: calc(80px + 2vw);
             accent-color: var(--accent);
         }
 
         input[type=&quot;number&quot;] {
             width: calc(50px + 1vw);
             padding: calc(3px + 0.2vw);
             background-color: var(--darkest);
             color: var(--lightest);
             border: 1px solid var(--border);
             border-radius: 4px;
             font-size: calc(12px + 0.3vw);
         }
 
         button {
             padding: calc(8px + 0.5vw) calc(15px + 1vw);
             background-color: var(--accent);
             color: var(--darkest);
             border: none;
             border-radius: 6px;
             font-weight: bold;
             font-size: calc(13px + 0.3vw);
             cursor: pointer;
             transition: all 0.3s ease;
             white-space: nowrap;
         }
 
         button:hover {
             transform: translateY(-2px);
             box-shadow: 0 5px 15px rgba(74, 158, 255, 0.3);
         }
 
         .info-panel {
             margin-top: 2vh;
             padding: calc(12px + 1vw);
             background-color: var(--darkest);
             border: 1px solid var(--border);
             border-radius: 6px;
             font-family: 'Courier New', monospace;
             font-size: calc(12px + 0.3vw);
             line-height: 1.5;
             overflow-x: auto;
         }
 
         .layer-label {
             margin-bottom: 1vh;
             color: var(--light);
             font-size: calc(11px + 0.3vw);
             text-transform: uppercase;
             letter-spacing: 0.05em;
             text-align: center;
         }
 
         #network-svg {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             z-index: 5;
         }
 
         .highlight {
             color: var(--accent);
             font-weight: bold;
         }
 
         @keyframes pulse {
             0% { transform: scale(1); }
             50% { transform: scale(1.1); }
             100% { transform: scale(1); }
         }
 
         .pulsing {
             animation: pulse 1s ease-in-out;
         }
 
         /* Mobile specific styles */
         @media (max-width: 768px) {
             body {
                 padding: 3vw;
             }
 
             h1 {
                 font-size: calc(1.3em + 2vw);
                 margin-bottom: 2vh;
             }
 
             .neural-network-container {
                 min-height: 40vh;
                 padding: calc(10px + 2vw);
             }
 
             .layers-wrapper {
                 gap: calc(30px + 5vw);
             }
 
             .layer {
                 gap: calc(15px + 1.5vh);
             }
 
             .neuron {
                 width: calc(35px + 4vw);
                 height: calc(35px + 4vw);
                 font-size: calc(10px + 0.5vw);
             }
 
             .controls {
                 gap: 1.5vw;
             }
 
             .input-control {
                 flex-direction: column;
                 align-items: stretch;
                 width: 100%;
                 max-width: 200px;
             }
 
             .input-control label {
                 text-align: center;
             }
 
             input[type=&quot;range&quot;] {
                 width: 100%;
             }
 
             input[type=&quot;number&quot;] {
                 width: 100%;
                 text-align: center;
             }
 
             button {
                 width: 100%;
                 max-width: 200px;
             }
 
             .info-panel {
                 font-size: calc(11px + 0.4vw);
             }
         }
 
         /* Extra small devices */
         @media (max-width: 480px) {
             .layers-wrapper {
                 gap: calc(20px + 3vw);
             }
 
             .neuron {
                 width: calc(30px + 5vw);
                 height: calc(30px + 5vw);
                 border-width: 2px;
             }
 
             .layer-label {
                 font-size: calc(10px + 0.4vw);
             }
 
             .controls {
                 flex-direction: column;
                 align-items: center;
             }
 
             .input-control,
             button {
                 width: 90%;
                 max-width: none;
             }
         }
 
         /* SVG text responsiveness */
         #network-svg text {
             font-size: calc(10px + 0.3vw);
         }
     </style>
 </head>
 <body>
     <div class=&quot;container&quot;>
         <h1>Hands-on learning</h1>
         
         <div class=&quot;tutorial-section&quot;>
             <h2>Here's an interactive tutorial on how neural networks work</h2>
             <p>A neural network processes information by passing inputs through layers of connected neurons. Each connection has a <span class=&quot;highlight&quot;>weight</span> that determines how much influence one neuron has on another.</p>
             <p>Try adjusting the inputs below and watch how the signal flows through the network!</p>
         </div>
 
         <div class=&quot;neural-network-container&quot;>
             <svg id=&quot;network-svg&quot;></svg>
             
             <div class=&quot;layers-wrapper&quot;>
                 <div class=&quot;layer&quot;>
                     <div class=&quot;layer-label&quot;>Input Layer</div>
                     <div class=&quot;neuron&quot; id=&quot;input1&quot; data-layer=&quot;input&quot; data-index=&quot;0&quot;>0.5</div>
                     <div class=&quot;neuron&quot; id=&quot;input2&quot; data-layer=&quot;input&quot; data-index=&quot;1&quot;>0.5</div>
                 </div>
                 
                 <div class=&quot;layer&quot;>
                     <div class=&quot;layer-label&quot;>Hidden Layer</div>
                     <div class=&quot;neuron&quot; id=&quot;hidden1&quot; data-layer=&quot;hidden&quot; data-index=&quot;0&quot;>0</div>
                     <div class=&quot;neuron&quot; id=&quot;hidden2&quot; data-layer=&quot;hidden&quot; data-index=&quot;1&quot;>0</div>
                     <div class=&quot;neuron&quot; id=&quot;hidden3&quot; data-layer=&quot;hidden&quot; data-index=&quot;2&quot;>0</div>
                 </div>
                 
                 <div class=&quot;layer&quot;>
                     <div class=&quot;layer-label&quot;>Output Layer</div>
                     <div class=&quot;neuron&quot; id=&quot;output1&quot; data-layer=&quot;output&quot; data-index=&quot;0&quot;>0</div>
                 </div>
             </div>
         </div>
 
         <div class=&quot;controls&quot;>
             <div class=&quot;input-control&quot;>
                 <label>Input 1:</label>
                 <input type=&quot;range&quot; id=&quot;input1-slider&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;>
                 <input type=&quot;number&quot; id=&quot;input1-value&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;>
             </div>
             <div class=&quot;input-control&quot;>
                 <label>Input 2:</label>
                 <input type=&quot;range&quot; id=&quot;input2-slider&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;>
                 <input type=&quot;number&quot; id=&quot;input2-value&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;>
             </div>
             <button onclick=&quot;randomizeWeights()&quot;>Randomize Weights</button>
             <button onclick=&quot;animateFlow()&quot;>Show Signal Flow</button>
         </div>
 
         <div class=&quot;info-panel&quot; id=&quot;info-panel&quot;>
             <div>Click on any neuron to see its calculation!</div>
         </div>
     </div>
 
     <script>
         // Neural network structure
         const network = {
             weights: {
                 inputToHidden: [
                     [0.5, -0.3, 0.8],  // weights from input1 to hidden neurons
                     [0.2, 0.7, -0.4]   // weights from input2 to hidden neurons
                 ],
                 hiddenToOutput: [0.6, -0.5, 0.9] // weights from hidden neurons to output
             },
             biases: {
                 hidden: [0.1, -0.2, 0.3],
                 output: [0.1]
             }
         };
 
         // Activation function (sigmoid)
         function sigmoid(x) {
             return 1 / (1 + Math.exp(-x));
         }
 
         // Calculate network output
         function forwardPass() {
             const inputs = [
                 parseFloat(document.getElementById('input1').textContent),
                 parseFloat(document.getElementById('input2').textContent)
             ];
             
             // Calculate hidden layer
             const hidden = [];
             for (let h = 0; h < 3; h++) {
                 let sum = network.biases.hidden[h];
                 for (let i = 0; i < 2; i++) {
                     sum += inputs[i] * network.weights.inputToHidden[i][h];
                 }
                 hidden[h] = sigmoid(sum);
                 document.getElementById(`hidden${h + 1}`).textContent = hidden[h].toFixed(3);
             }
             
             // Calculate output layer
             let outputSum = network.biases.output[0];
             for (let h = 0; h < 3; h++) {
                 outputSum += hidden[h] * network.weights.hiddenToOutput[h];
             }
             const output = sigmoid(outputSum);
             document.getElementById('output1').textContent = output.toFixed(3);
             
             // Update visual connections
             updateConnections();
         }
 
         // Draw connections between neurons
         function drawConnections() {
             const svg = document.getElementById('network-svg');
             svg.innerHTML = '';
             
             const inputNeurons = document.querySelectorAll('[data-layer=&quot;input&quot;]');
             const hiddenNeurons = document.querySelectorAll('[data-layer=&quot;hidden&quot;]');
             const outputNeurons = document.querySelectorAll('[data-layer=&quot;output&quot;]');
             
             // Input to hidden connections
             inputNeurons.forEach((input, i) => {
                 hiddenNeurons.forEach((hidden, h) => {
                     drawConnection(svg, input, hidden, network.weights.inputToHidden[i][h], `w_i${i}h${h}`);
                 });
             });
             
             // Hidden to output connections
             hiddenNeurons.forEach((hidden, h) => {
                 outputNeurons.forEach((output) => {
                     drawConnection(svg, hidden, output, network.weights.hiddenToOutput[h], `w_h${h}o0`);
                 });
             });
         }
 
         function drawConnection(svg, from, to, weight, id) {
             const fromRect = from.getBoundingClientRect();
             const toRect = to.getBoundingClientRect();
             const containerRect = svg.parentElement.getBoundingClientRect();
             
             const x1 = fromRect.left + fromRect.width / 2 - containerRect.left;
             const y1 = fromRect.top + fromRect.height / 2 - containerRect.top;
             const x2 = toRect.left + toRect.width / 2 - containerRect.left;
             const y2 = toRect.top + toRect.height / 2 - containerRect.top;
             
             const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
             line.setAttribute('x1', x1);
             line.setAttribute('y1', y1);
             line.setAttribute('x2', x2);
             line.setAttribute('y2', y2);
             line.setAttribute('stroke', weight >= 0 ? '#52c41a' : '#ff4d4f');
             line.setAttribute('stroke-width', Math.max(1, Math.abs(weight) * 3));
             line.setAttribute('opacity', 0.6);
             line.setAttribute('id', id);
             
             const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
             text.setAttribute('x', (x1 + x2) / 2);
             text.setAttribute('y', (y1 + y2) / 2 - 5);
             text.setAttribute('text-anchor', 'middle');
             text.setAttribute('fill', '#dddddd');
             text.setAttribute('font-weight', 'bold');
             text.textContent = weight.toFixed(2);
             
             svg.appendChild(line);
             svg.appendChild(text);
         }
 
         function updateConnections() {
             drawConnections();
         }
 
         // Input control handlers
         document.getElementById('input1-slider').addEventListener('input', function(e) {
             const value = parseFloat(e.target.value);
             document.getElementById('input1-value').value = value;
             document.getElementById('input1').textContent = value;
             forwardPass();
         });
 
         document.getElementById('input1-value').addEventListener('input', function(e) {
             const value = parseFloat(e.target.value);
             document.getElementById('input1-slider').value = value;
             document.getElementById('input1').textContent = value;
             forwardPass();
         });
 
         document.getElementById('input2-slider').addEventListener('input', function(e) {
             const value = parseFloat(e.target.value);
             document.getElementById('input2-value').value = value;
             document.getElementById('input2').textContent = value;
             forwardPass();
         });
 
         document.getElementById('input2-value').addEventListener('input', function(e) {
             const value = parseFloat(e.target.value);
             document.getElementById('input2-slider').value = value;
             document.getElementById('input2').textContent = value;
             forwardPass();
         });
 
         // Neuron click handler
         document.querySelectorAll('.neuron').forEach(neuron => {
             neuron.addEventListener('click', function() {
                 showNeuronCalculation(this);
             });
         });
 
         function showNeuronCalculation(neuron) {
             const layer = neuron.dataset.layer;
             const index = parseInt(neuron.dataset.index);
             const infoPanel = document.getElementById('info-panel');
             
             if (layer === 'input') {
                 infoPanel.innerHTML = `
                     <div><strong>Input Neuron ${index + 1}</strong></div>
                     <div>Value: ${neuron.textContent}</div>
                     <div>This neuron receives external input and passes it to the hidden layer.</div>
                 `;
             } else if (layer === 'hidden') {
                 const inputs = [
                     parseFloat(document.getElementById('input1').textContent),
                     parseFloat(document.getElementById('input2').textContent)
                 ];
                 
                 let calculation = `<div><strong>Hidden Neuron ${index + 1}</strong></div>`;
                 calculation += `<div>Calculation:</div>`;
                 calculation += `<div>Sum = bias + (input1 × weight1) + (input2 × weight2)</div>`;
                 calculation += `<div>Sum = ${network.biases.hidden[index].toFixed(2)} + `;
                 calculation += `(${inputs[0].toFixed(2)} × ${network.weights.inputToHidden[0][index].toFixed(2)}) + `;
                 calculation += `(${inputs[1].toFixed(2)} × ${network.weights.inputToHidden[1][index].toFixed(2)})</div>`;
                 
                 const sum = network.biases.hidden[index] + 
                            inputs[0] * network.weights.inputToHidden[0][index] + 
                            inputs[1] * network.weights.inputToHidden[1][index];
                 
                 calculation += `<div>Sum = ${sum.toFixed(3)}</div>`;
                 calculation += `<div>Output = sigmoid(${sum.toFixed(3)}) = ${neuron.textContent}</div>`;
                 
                 infoPanel.innerHTML = calculation;
             } else if (layer === 'output') {
                 const hidden = [
                     parseFloat(document.getElementById('hidden1').textContent),
                     parseFloat(document.getElementById('hidden2').textContent),
                     parseFloat(document.getElementById('hidden3').textContent)
                 ];
                 
                 let calculation = `<div><strong>Output Neuron</strong></div>`;
                 calculation += `<div>Calculation:</div>`;
                 
                 // For mobile, use shorter format if screen is small
                 if (window.innerWidth <= 480) {
                     calculation += `<div>Sum = bias + Σ(hidden × weight)</div>`;
                 } else {
                     calculation += `<div>Sum = bias + (hidden1 × weight1) + (hidden2 × weight2) + (hidden3 × weight3)</div>`;
                 }
                 
                 calculation += `<div>Sum = ${network.biases.output[0].toFixed(2)} + `;
                 calculation += `(${hidden[0].toFixed(3)} × ${network.weights.hiddenToOutput[0].toFixed(2)}) + `;
                 calculation += `(${hidden[1].toFixed(3)} × ${network.weights.hiddenToOutput[1].toFixed(2)}) + `;
                 calculation += `(${hidden[2].toFixed(3)} × ${network.weights.hiddenToOutput[2].toFixed(2)})</div>`;
                 
                 const sum = network.biases.output[0] + 
                            hidden[0] * network.weights.hiddenToOutput[0] + 
                            hidden[1] * network.weights.hiddenToOutput[1] + 
                            hidden[2] * network.weights.hiddenToOutput[2];
                 
                 calculation += `<div>Sum = ${sum.toFixed(3)}</div>`;
                 calculation += `<div>Output = sigmoid(${sum.toFixed(3)}) = ${neuron.textContent}</div>`;
                 
                 infoPanel.innerHTML = calculation;
             }
             
             // Add pulse animation
             neuron.classList.add('pulsing');
             setTimeout(() => neuron.classList.remove('pulsing'), 1000);
         }
 
         function randomizeWeights() {
             // Randomize input to hidden weights
             for (let i = 0; i < 2; i++) {
                 for (let h = 0; h < 3; h++) {
                     network.weights.inputToHidden[i][h] = Math.random() * 2 - 1;
                 }
             }
             
             // Randomize hidden to output weights
             for (let h = 0; h < 3; h++) {
                 network.weights.hiddenToOutput[h] = Math.random() * 2 - 1;
             }
             
             // Randomize biases
             for (let h = 0; h < 3; h++) {
                 network.biases.hidden[h] = Math.random() * 0.4 - 0.2;
             }
             network.biases.output[0] = Math.random() * 0.4 - 0.2;
             
             forwardPass();
         }
 
         function animateFlow() {
             const neurons = document.querySelectorAll('.neuron');
             neurons.forEach(n => n.classList.remove('active'));
             
             // Animate input neurons
             setTimeout(() => {
                 document.getElementById('input1').classList.add('active');
                 document.getElementById('input2').classList.add('active');
             }, 0);
             
             // Animate hidden neurons
             setTimeout(() => {
                 document.getElementById('hidden1').classList.add('active');
                 document.getElementById('hidden2').classList.add('active');
                 document.getElementById('hidden3').classList.add('active');
             }, 500);
             
             // Animate output neuron
             setTimeout(() => {
                 document.getElementById('output1').classList.add('active');
             }, 1000);
             
             // Remove animation classes
             setTimeout(() => {
                 neurons.forEach(n => n.classList.remove('active'));
             }, 2000);
         }
 
         // Initialize on page load
         window.addEventListener('load', function() {
             forwardPass();
         });
 
         // Redraw connections on window resize with debouncing
         let resizeTimeout;
         window.addEventListener('resize', function() {
             clearTimeout(resizeTimeout);
             resizeTimeout = setTimeout(function() {
                 drawConnections();
             }, 250);
         });
 
         // Touch event support for mobile
         let touchStartY = 0;
         
         document.addEventListener('touchstart', function(e) {
             touchStartY = e.touches[0].clientY;
         }, { passive: true });
         
         document.addEventListener('touchmove', function(e) {
             // Prevent pull-to-refresh on mobile
             if (e.touches[0].clientY > touchStartY) {
                 e.preventDefault();
             }
         }, { passive: false });
     </script>
