     <h1>Deep dive into informative content</h1>
     <p class=&quot;subtitle&quot;>Here's an interactive blog on machine learning</p>
     
     <section>
         <p>Welcome to an interactive exploration of neural networks and machine learning. As you scroll through this article, you'll encounter hands-on demonstrations that bring abstract concepts to life. Let's start with the fundamental question: What is machine learning?</p>
         
         <p>At its core, <span class=&quot;highlight&quot;>machine learning is about finding patterns in data</span>. Instead of explicitly programming rules, we let algorithms discover patterns from examples. Neural networks are one of the most powerful approaches to machine learning, inspired by the human brain's structure.</p>
     </section>
     
     <section>
         <h2>The Building Block: The Perceptron</h2>
         
         <p>Let's begin with the simplest neural network component: the perceptron. A perceptron takes inputs, multiplies them by weights, adds them up, and produces an output based on whether the sum exceeds a threshold.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Simple Perceptron</div>
             <p>Click on the canvas to add points. Blue points are class 0, red points are class 1. The perceptron will learn to separate them with a line.</p>
             <canvas id=&quot;perceptron-canvas&quot; width=&quot;600&quot; height=&quot;400&quot;></canvas>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;trainPerceptron()&quot;>Train Perceptron</button>
                 <button onclick=&quot;clearPerceptron()&quot;>Clear</button>
                 <button onclick=&quot;toggleClass()&quot;>Toggle Class (Current: <span id=&quot;current-class&quot;>Blue</span>)</button>
             </div>
             <div id=&quot;perceptron-info&quot;></div>
         </div>
         
         <p>The perceptron learns by adjusting its weights. When it makes a mistake, it updates the weights to reduce the error. This is the foundation of how neural networks learn!</p>
         
         <div class=&quot;math&quot;>
             Output = activation(w₁·x₁ + w₂·x₂ + ... + wₙ·xₙ + bias)
         </div>
     </section>
     
     <section>
         <h2>From Perceptron to Neural Networks</h2>
         
         <p>While a single perceptron can only learn linearly separable patterns, we can combine multiple perceptrons in layers to learn complex, non-linear patterns. This is the essence of a neural network.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Neural Network Architecture</div>
             <p>Hover over neurons and connections to see how information flows through the network.</p>
             <svg id=&quot;nn-architecture&quot; width=&quot;600&quot; height=&quot;400&quot;></svg>
             <div id=&quot;nn-info&quot; style=&quot;text-align: center; margin-top: 20px;&quot;>
                 <p>Input Layer → Hidden Layers → Output Layer</p>
             </div>
         </div>
         
         <p>Each connection between neurons has a weight, and each neuron (except input neurons) has an activation function that determines its output based on the weighted sum of its inputs.</p>
     </section>
     
     <section>
         <h2>The Learning Process: Gradient Descent</h2>
         
         <p>Neural networks learn through an optimization algorithm called <span class=&quot;highlight&quot;>gradient descent</span>. Imagine you're trying to find the lowest point in a valley while blindfolded. Gradient descent works similarly - it feels the slope and takes steps downhill.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Gradient Descent Visualization</div>
             <p>Click anywhere on the landscape to drop a ball. Watch it roll down to find the minimum!</p>
             <canvas id=&quot;gradient-canvas&quot; width=&quot;600&quot; height=&quot;400&quot;></canvas>
             <div class=&quot;slider-container&quot;>
                 <label>Learning Rate: <span id=&quot;lr-value&quot;>0.1</span></label>
                 <input type=&quot;range&quot; id=&quot;learning-rate&quot; min=&quot;0.01&quot; max=&quot;0.5&quot; step=&quot;0.01&quot; value=&quot;0.1&quot;>
             </div>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;resetGradient()&quot;>Reset</button>
                 <button onclick=&quot;changeFunction()&quot;>Change Function</button>
             </div>
         </div>
         
         <div class=&quot;info-box&quot;>
             <strong>Key Insight:</strong> The learning rate controls how big our steps are. Too small, and learning is slow. Too large, and we might overshoot the minimum!
         </div>
     </section>
     
     <section>
         <h2>Backpropagation: The Learning Algorithm</h2>
         
         <p>Backpropagation is how neural networks calculate gradients efficiently. It works by propagating the error backwards through the network, computing how much each weight contributed to the error.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Backpropagation Flow</div>
             <p>Click &quot;Forward Pass&quot; to see data flow through the network, then &quot;Backward Pass&quot; to see how errors propagate back.</p>
             <canvas id=&quot;backprop-canvas&quot; width=&quot;600&quot; height=&quot;500&quot;></canvas>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;forwardPass()&quot;>Forward Pass</button>
                 <button onclick=&quot;backwardPass()&quot;>Backward Pass</button>
                 <button onclick=&quot;resetBackprop()&quot;>Reset</button>
             </div>
             <div id=&quot;backprop-info&quot;></div>
         </div>
         
         <div class=&quot;math&quot;>
             Chain Rule: ∂Loss/∂w = ∂Loss/∂output × ∂output/∂w
         </div>
     </section>
     
     <section>
         <h2>A Real Example: Digit Recognition</h2>
         
         <p>Let's put it all together with a classic example: recognizing handwritten digits. Draw a digit below, and watch a simple neural network try to recognize it!</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Digit Recognition</div>
             <p>Draw a digit (0-9) in the box below:</p>
             <canvas id=&quot;digit-canvas&quot; width=&quot;280&quot; height=&quot;280&quot; style=&quot;background: white; border: 2px solid #333;&quot;></canvas>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;clearDigit()&quot;>Clear</button>
                 <button onclick=&quot;recognizeDigit()&quot;>Recognize</button>
             </div>
             <div id=&quot;digit-result&quot; style=&quot;text-align: center; margin-top: 20px;&quot;>
                 <h3>Predictions:</h3>
                 <div id=&quot;predictions&quot;></div>
             </div>
         </div>
         
         <p>This demo uses a pre-trained neural network with 784 input neurons (28×28 pixels), two hidden layers, and 10 output neurons (one for each digit).</p>
     </section>
     
     <section>
         <h2>Activation Functions</h2>
         
         <p>Activation functions introduce non-linearity into neural networks, allowing them to learn complex patterns. Without them, even deep networks would only be able to learn linear relationships.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Activation Functions</div>
             <canvas id=&quot;activation-canvas&quot; width=&quot;600&quot; height=&quot;400&quot;></canvas>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;showActivation('sigmoid')&quot;>Sigmoid</button>
                 <button onclick=&quot;showActivation('tanh')&quot;>Tanh</button>
                 <button onclick=&quot;showActivation('relu')&quot;>ReLU</button>
                 <button onclick=&quot;showActivation('leaky-relu')&quot;>Leaky ReLU</button>
             </div>
             <div id=&quot;activation-info&quot;></div>
         </div>
         
         <div class=&quot;info-box&quot;>
             <strong>Popular Activation Functions:</strong>
             <ul>
                 <li><strong>Sigmoid:</strong> Squashes values between 0 and 1</li>
                 <li><strong>Tanh:</strong> Squashes values between -1 and 1</li>
                 <li><strong>ReLU:</strong> Returns 0 for negative values, x for positive</li>
                 <li><strong>Leaky ReLU:</strong> Small slope for negative values instead of 0</li>
             </ul>
         </div>
     </section>
     
     <section>
         <h2>Training Challenges</h2>
         
         <p>Training neural networks isn't always straightforward. Let's explore some common challenges:</p>
         
         <div class=&quot;warning-box&quot;>
             <strong>Common Training Problems:</strong>
             <ul>
                 <li><strong>Overfitting:</strong> The network memorizes training data instead of learning patterns</li>
                 <li><strong>Underfitting:</strong> The network is too simple to capture the underlying patterns</li>
                 <li><strong>Vanishing Gradients:</strong> Gradients become too small in deep networks</li>
                 <li><strong>Exploding Gradients:</strong> Gradients become too large, causing instability</li>
             </ul>
         </div>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Overfitting vs Underfitting</div>
             <canvas id=&quot;fitting-canvas&quot; width=&quot;600&quot; height=&quot;400&quot;></canvas>
             <div class=&quot;slider-container&quot;>
                 <label>Model Complexity: <span id=&quot;complexity-value&quot;>3</span></label>
                 <input type=&quot;range&quot; id=&quot;model-complexity&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;3&quot;>
             </div>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;generateData()&quot;>New Data</button>
                 <button onclick=&quot;toggleNoise()&quot;>Toggle Noise</button>
             </div>
         </div>
     </section>
     
     <section>
         <h2>Modern Techniques</h2>
         
         <p>Neural networks have evolved significantly. Modern techniques help overcome traditional limitations and enable training of deeper, more powerful networks.</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Dropout Regularization</div>
             <p>Click neurons to see how dropout randomly disables connections during training to prevent overfitting.</p>
             <svg id=&quot;dropout-demo&quot; width=&quot;600&quot; height=&quot;400&quot;></svg>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;applyDropout()&quot;>Apply Dropout</button>
                 <button onclick=&quot;resetDropout()&quot;>Reset</button>
                 <label>Dropout Rate: <span id=&quot;dropout-rate&quot;>0.5</span></label>
                 <input type=&quot;range&quot; id=&quot;dropout-slider&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;>
             </div>
         </div>
         
         <div class=&quot;info-box&quot;>
             <strong>Modern Improvements:</strong>
             <ul>
                 <li><strong>Batch Normalization:</strong> Normalizes inputs to each layer</li>
                 <li><strong>Dropout:</strong> Randomly disables neurons during training</li>
                 <li><strong>Adam Optimizer:</strong> Adaptive learning rates for each parameter</li>
                 <li><strong>Transfer Learning:</strong> Using pre-trained networks as starting points</li>
             </ul>
         </div>
     </section>
     
     <section>
         <h2>Types of Neural Networks</h2>
         
         <p>Different problems require different network architectures. Let's explore the main types:</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Network Types Comparison</div>
             <div id=&quot;network-types&quot; style=&quot;display: flex; justify-content: space-around; flex-wrap: wrap;&quot;>
                 <div style=&quot;text-align: center; margin: 10px;&quot;>
                     <svg id=&quot;feedforward-net&quot; width=&quot;180&quot; height=&quot;200&quot;></svg>
                     <p><strong>Feedforward</strong><br>Basic architecture</p>
                 </div>
                 <div style=&quot;text-align: center; margin: 10px;&quot;>
                     <svg id=&quot;cnn-net&quot; width=&quot;180&quot; height=&quot;200&quot;></svg>
                     <p><strong>CNN</strong><br>For images</p>
                 </div>
                 <div style=&quot;text-align: center; margin: 10px;&quot;>
                     <svg id=&quot;rnn-net&quot; width=&quot;180&quot; height=&quot;200&quot;></svg>
                     <p><strong>RNN</strong><br>For sequences</p>
                 </div>
             </div>
         </div>
     </section>
     
     <section>
         <h2>Real-World Applications</h2>
         
         <p>Neural networks power many technologies we use daily. Here's a simplified example of how they work in image classification:</p>
         
         <div class=&quot;demo-container&quot;>
             <div class=&quot;demo-title&quot;>Interactive Demo: Simple Image Classifier</div>
             <p>Upload an image or use the camera to see how a neural network processes visual information:</p>
             <canvas id=&quot;image-canvas&quot; width=&quot;400&quot; height=&quot;400&quot;></canvas>
             <div class=&quot;controls&quot;>
                 <button onclick=&quot;loadSampleImage()&quot;>Load Sample</button>
                 <button onclick=&quot;processImage()&quot;>Classify</button>
             </div>
             <div id=&quot;classification-result&quot;></div>
         </div>
     </section>
     
     <section>
         <h2>The Future of Neural Networks</h2>
         
         <p>As we've seen, neural networks are powerful tools for pattern recognition and learning. The field continues to evolve rapidly with innovations like:</p>
         
         <ul>
             <li><strong>Transformers:</strong> The architecture behind GPT and BERT</li>
             <li><strong>GANs:</strong> Networks that can generate new data</li>
             <li><strong>Neural Architecture Search:</strong> AI designing AI</li>
             <li><strong>Quantum Neural Networks:</strong> Leveraging quantum computing</li>
         </ul>
         
         <div class=&quot;code-block&quot;>
 # The beauty of neural networks in Python
 import numpy as np
 
 def neural_network(X, weights):
     # Forward propagation
     layer1 = sigmoid(np.dot(X, weights[0]))
     output = sigmoid(np.dot(layer1, weights[1]))
     return output
 
 # That's it! The core is surprisingly simple.
         </div>
     </section>
     
     <section>
         <h2>Conclusion</h2>
         
         <p>You've just experienced an interactive journey through the world of neural networks! From simple perceptrons to complex architectures, these systems learn by adjusting millions of parameters to find patterns in data.</p>
         
         <p>The key takeaways:</p>
         <ul>
             <li>Neural networks learn by adjusting weights through gradient descent</li>
             <li>Backpropagation efficiently computes gradients</li>
             <li>Different architectures suit different problems</li>
             <li>Modern techniques help overcome traditional limitations</li>
         </ul>
         
         <p>Keep experimenting with the demos above to deepen your understanding. The best way to learn about neural networks is to see them in action!</p>
     </section>
     
     <script>
         // Perceptron Demo
         let perceptronCanvas = document.getElementById('perceptron-canvas');
         let perceptronCtx = perceptronCanvas.getContext('2d');
         let points = [];
         let currentClass = 0;
         let perceptronWeights = [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5];
         
         perceptronCanvas.addEventListener('click', (e) => {
             let rect = perceptronCanvas.getBoundingClientRect();
             let x = (e.clientX - rect.left) / perceptronCanvas.width;
             let y = (e.clientY - rect.top) / perceptronCanvas.height;
             points.push({x: x, y: y, class: currentClass});
             drawPerceptron();
         });
         
         function drawPerceptron() {
             perceptronCtx.clearRect(0, 0, perceptronCanvas.width, perceptronCanvas.height);
             
             // Draw decision boundary
             if (Math.abs(perceptronWeights[1]) > 0.001) {
                 perceptronCtx.strokeStyle = '#2ecc71';
                 perceptronCtx.lineWidth = 2;
                 perceptronCtx.beginPath();
                 let x1 = 0;
                 let y1 = (-perceptronWeights[2] - perceptronWeights[0] * x1) / perceptronWeights[1];
                 let x2 = 1;
                 let y2 = (-perceptronWeights[2] - perceptronWeights[0] * x2) / perceptronWeights[1];
                 perceptronCtx.moveTo(x1 * perceptronCanvas.width, y1 * perceptronCanvas.height);
                 perceptronCtx.lineTo(x2 * perceptronCanvas.width, y2 * perceptronCanvas.height);
                 perceptronCtx.stroke();
             }
             
             // Draw points
             points.forEach(point => {
                 perceptronCtx.fillStyle = point.class === 0 ? '#3498db' : '#e74c3c';
                 perceptronCtx.beginPath();
                 perceptronCtx.arc(point.x * perceptronCanvas.width, point.y * perceptronCanvas.height, 5, 0, 2 * Math.PI);
                 perceptronCtx.fill();
             });
         }
         
         function trainPerceptron() {
             const learningRate = 0.1;
             const epochs = 100;
             
             for (let epoch = 0; epoch < epochs; epoch++) {
                 points.forEach(point => {
                     let input = [point.x, point.y, 1];
                     let prediction = input[0] * perceptronWeights[0] + 
                                    input[1] * perceptronWeights[1] + 
                                    input[2] * perceptronWeights[2];
                     prediction = prediction > 0 ? 1 : 0;
                     
                     let error = point.class - prediction;
                     for (let i = 0; i < 3; i++) {
                         perceptronWeights[i] += learningRate * error * input[i];
                     }
                 });
             }
             
             drawPerceptron();
             document.getElementById('perceptron-info').innerHTML = 
                 `<p>Weights updated! w1=${perceptronWeights[0].toFixed(3)}, w2=${perceptronWeights[1].toFixed(3)}, bias=${perceptronWeights[2].toFixed(3)}</p>`;
         }
         
         function clearPerceptron() {
             points = [];
             perceptronWeights = [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5];
             drawPerceptron();
         }
         
         function toggleClass() {
             currentClass = 1 - currentClass;
             document.getElementById('current-class').textContent = currentClass === 0 ? 'Blue' : 'Red';
         }
         
         // Neural Network Architecture Demo
         function drawNeuralNetwork() {
             let svg = document.getElementById('nn-architecture');
             svg.innerHTML = '';
             
             let layers = [3, 4, 4, 2];
             let layerSpacing = 150;
             let neuronSpacing = 60;
             
             let neurons = [];
             
             // Draw neurons
             layers.forEach((count, layerIndex) => {
                 neurons[layerIndex] = [];
                 let x = 100 + layerIndex * layerSpacing;
                 let startY = 200 - (count * neuronSpacing) / 2;
                 
                 for (let i = 0; i < count; i++) {
                     let y = startY + i * neuronSpacing;
                     
                     let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                     circle.setAttribute('cx', x);
                     circle.setAttribute('cy', y);
                     circle.setAttribute('r', 20);
                     circle.classList.add('neuron');
                     
                     circle.addEventListener('mouseenter', () => {
                         document.getElementById('nn-info').innerHTML = 
                             `<p>Layer ${layerIndex + 1}, Neuron ${i + 1}: ${layerIndex === 0 ? 'Input' : layerIndex === layers.length - 1 ? 'Output' : 'Hidden'} neuron</p>`;
                     });
                     
                     svg.appendChild(circle);
                     neurons[layerIndex].push({x, y});
                 }
             });
             
             // Draw connections
             for (let l = 0; l < layers.length - 1; l++) {
                 for (let i = 0; i < neurons[l].length; i++) {
                     for (let j = 0; j < neurons[l + 1].length; j++) {
                         let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                         line.setAttribute('x1', neurons[l][i].x);
                         line.setAttribute('y1', neurons[l][i].y);
                         line.setAttribute('x2', neurons[l + 1][j].x);
                         line.setAttribute('y2', neurons[l + 1][j].y);
                         line.classList.add('connection');
                         svg.insertBefore(line, svg.firstChild);
                     }
                 }
             }
         }
         
         // Gradient Descent Demo
         let gradientCanvas = document.getElementById('gradient-canvas');
         let gradientCtx = gradientCanvas.getContext('2d');
         let balls = [];
         let currentFunction = 0;
         let functions = [
             (x, y) => x*x + y*y,  // Simple bowl
             (x, y) => Math.sin(x*3) * Math.cos(y*3) + (x*x + y*y)/4,  // Complex landscape
             (x, y) => (x*x + y*y)/2 + Math.cos(x*2*Math.PI) * 0.1  // Bowl with ripples
         ];
         
         function drawGradientLandscape() {
             let imageData = gradientCtx.createImageData(gradientCanvas.width, gradientCanvas.height);
             let data = imageData.data;
             
             for (let px = 0; px < gradientCanvas.width; px++) {
                 for (let py = 0; py < gradientCanvas.height; py++) {
                     let x = (px / gradientCanvas.width - 0.5) * 4;
                     let y = (py / gradientCanvas.height - 0.5) * 4;
                     let z = functions[currentFunction](x, y);
                     let intensity = Math.max(0, Math.min(255, 128 - z * 50));
                     
                     let index = (py * gradientCanvas.width + px) * 4;
                     data[index] = intensity;
                     data[index + 1] = intensity + 20;
                     data[index + 2] = intensity + 40;
                     data[index + 3] = 255;
                 }
             }
             
             gradientCtx.putImageData(imageData, 0, 0);
             
             // Draw balls
             balls.forEach(ball => {
                 gradientCtx.fillStyle = '#e74c3c';
                 gradientCtx.beginPath();
                 gradientCtx.arc(ball.x * gradientCanvas.width, ball.y * gradientCanvas.height, 5, 0, 2 * Math.PI);
                 gradientCtx.fill();
             });
         }
         
         gradientCanvas.addEventListener('click', (e) => {
             let rect = gradientCanvas.getBoundingClientRect();
             let x = (e.clientX - rect.left) / gradientCanvas.width;
             let y = (e.clientY - rect.top) / gradientCanvas.height;
             balls.push({x: x, y: y, vx: 0, vy: 0});
             animateGradientDescent();
         });
         
         function animateGradientDescent() {
             let learningRate = parseFloat(document.getElementById('learning-rate').value);
             
             function step() {
                 drawGradientLandscape();
                 
                 let moving = false;
                 balls.forEach(ball => {
                     // Convert to function coordinates
                     let fx = (ball.x - 0.5) * 4;
                     let fy = (ball.y - 0.5) * 4;
                     
                     // Calculate gradients (numerical approximation)
                     let h = 0.001;
                     let dfdx = (functions[currentFunction](fx + h, fy) - functions[currentFunction](fx - h, fy)) / (2 * h);
                     let dfdy = (functions[currentFunction](fx, fy + h) - functions[currentFunction](fx, fy - h)) / (2 * h);
                     
                     // Update velocity with momentum
                     ball.vx = ball.vx * 0.9 - learningRate * dfdx;
                     ball.vy = ball.vy * 0.9 - learningRate * dfdy;
                     
                     // Update position
                     ball.x += ball.vx / 4;  // Scale back to canvas coordinates
                     ball.y += ball.vy / 4;
                     
                     // Keep within bounds
                     ball.x = Math.max(0.05, Math.min(0.95, ball.x));
                     ball.y = Math.max(0.05, Math.min(0.95, ball.y));
                     
                     if (Math.abs(ball.vx) > 0.0001 || Math.abs(ball.vy) > 0.0001) {
                         moving = true;
                     }
                 });
                 
                 if (moving) {
                     requestAnimationFrame(step);
                 }
             }
             
             step();
         }

             document.getElementById('lr-value').textContent = e.target.value;
         });

         // Backpropagation Demo
         let backpropCanvas = document.getElementById('backprop-canvas');
         let backpropCtx = backpropCanvas.getContext('2d');
         let networkState = 'idle';
         let animationProgress = 0;
         
         function drawBackpropNetwork() {
             backpropCtx.clearRect(0, 0, backpropCanvas.width, backpropCanvas.height);
             
             // Network structure
             let layers = [
                 {neurons: 2, x: 100, label: 'Input'},
                 {neurons: 3, x: 250, label: 'Hidden'},
                 {neurons: 1, x: 400, label: 'Output'}
             ];
             
             // Draw layers
             layers.forEach((layer, layerIndex) => {
                 backpropCtx.fillStyle = '#2c3e50';
                 backpropCtx.font = '14px Arial';
                 backpropCtx.textAlign = 'center';
                 backpropCtx.fillText(layer.label, layer.x, 30);
                 
                 let startY = 250 - (layer.neurons * 60) / 2;
                 
                 for (let i = 0; i < layer.neurons; i++) {
                     let y = startY + i * 60;
                     
                     // Draw neuron
                     backpropCtx.beginPath();
                     backpropCtx.arc(layer.x, y, 25, 0, 2 * Math.PI);
                     
                     if (networkState === 'forward' &amp;&amp; animationProgress > layerIndex * 0.3) {
                         backpropCtx.fillStyle = '#3498db';
                         backpropCtx.fill();
                     } else if (networkState === 'backward' &amp;&amp; animationProgress > (2 - layerIndex) * 0.3) {
                         backpropCtx.fillStyle = '#e74c3c';
                         backpropCtx.fill();
                     } else {
                         backpropCtx.fillStyle = '#ecf0f1';
                         backpropCtx.fill();
                     }
                     
                     backpropCtx.strokeStyle = '#2c3e50';
                     backpropCtx.lineWidth = 2;
                     backpropCtx.stroke();
                     
                     // Draw connections to next layer
                     if (layerIndex < layers.length - 1) {
                         let nextLayer = layers[layerIndex + 1];
                         let nextStartY = 250 - (nextLayer.neurons * 60) / 2;
                         
                         for (let j = 0; j < nextLayer.neurons; j++) {
                             let nextY = nextStartY + j * 60;
                             backpropCtx.beginPath();
                             backpropCtx.moveTo(layer.x + 25, y);
                             backpropCtx.lineTo(nextLayer.x - 25, nextY);
                             
                             if (networkState === 'forward' &amp;&amp; 
                                 animationProgress > layerIndex * 0.3 &amp;&amp; 
                                 animationProgress < (layerIndex + 1) * 0.3 + 0.3) {
                                 backpropCtx.strokeStyle = '#3498db';
                                 backpropCtx.lineWidth = 3;
                             } else if (networkState === 'backward' &amp;&amp; 
                                        animationProgress > (1 - layerIndex) * 0.3 &amp;&amp; 
                                        animationProgress < (2 - layerIndex) * 0.3 + 0.3) {
                                 backpropCtx.strokeStyle = '#e74c3c';
                                 backpropCtx.lineWidth = 3;
                             } else {
                                 backpropCtx.strokeStyle = '#95a5a6';
                                 backpropCtx.lineWidth = 1;
                             }
                             
                             backpropCtx.stroke();
                         }
                     }
                 }
             });
             
             // Draw info
             if (networkState === 'forward') {
                 backpropCtx.fillStyle = '#3498db';
                 backpropCtx.font = 'bold 16px Arial';
                 backpropCtx.fillText('Forward Pass →', backpropCanvas.width/2, 450);
             } else if (networkState === 'backward') {
                 backpropCtx.fillStyle = '#e74c3c';
                 backpropCtx.font = 'bold 16px Arial';
                 backpropCtx.fillText('← Backward Pass', backpropCanvas.width/2, 450);
             }
         }

         function showActivation(type) {
             activationCtx.clearRect(0, 0, activationCanvas.width, activationCanvas.height);
             
             // Draw axes
             activationCtx.strokeStyle = '#2c3e50';
             activationCtx.lineWidth = 2;
             activationCtx.beginPath();
             activationCtx.moveTo(50, activationCanvas.height/2);
             activationCtx.lineTo(activationCanvas.width - 50, activationCanvas.height/2);
             activationCtx.moveTo(activationCanvas.width/2, 50);
             activationCtx.lineTo(activationCanvas.width/2, activationCanvas.height - 50);
             activationCtx.stroke();
             
             // Draw function
             activationCtx.strokeStyle = '#3498db';
             activationCtx.lineWidth = 3;
             activationCtx.beginPath();
             
             let functions = {
                 'sigmoid': x => 1 / (1 + Math.exp(-x)),
                 'tanh': x => Math.tanh(x),
                 'relu': x => Math.max(0, x),
                 'leaky-relu': x => x > 0 ? x : 0.01 * x
             };
             
             let func = functions[type];
             let scale = 40;
             
             for (let px = 50; px < activationCanvas.width - 50; px++) {
                 let x = (px - activationCanvas.width/2) / scale;
                 let y = func(x);
                 let py = activationCanvas.height/2 - y * scale;
                 
                 if (px === 50) {
                     activationCtx.moveTo(px, py);
                 } else {
                     activationCtx.lineTo(px, py);
                 }
             }
             
             activationCtx.stroke();
             
             // Update info
             let descriptions = {
                 'sigmoid': 'σ(x) = 1 / (1 + e^(-x)) - Squashes input to [0, 1]',
                 'tanh': 'tanh(x) = (e^x - e^(-x)) / (e^x + e^(-x)) - Squashes to [-1, 1]',
                 'relu': 'f(x) = max(0, x) - Simple and effective',
                 'leaky-relu': 'f(x) = max(0.01x, x) - Prevents dead neurons'
             };
             
             document.getElementById('activation-info').innerHTML = 
                 `<p><strong>${type.toUpperCase()}:</strong> ${descriptions[type]}</p>`;
         }

         // Dropout Demo
         function createDropoutNetwork() {
             let svg = document.getElementById('dropout-demo');
             svg.innerHTML = '';
             
             let layers = [4, 6, 6, 3];
             let neurons = [];
             let connections = [];
             
             // Create neurons
             layers.forEach((count, layerIndex) => {
                 neurons[layerIndex] = [];
                 let x = 100 + layerIndex * 120;
                 let startY = 200 - (count * 50) / 2;
                 
                 for (let i = 0; i < count; i++) {
                     let y = startY + i * 50;
                     
                     let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                     let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                     circle.setAttribute('cx', x);
                     circle.setAttribute('cy', y);
                     circle.setAttribute('r', 15);
                     circle.classList.add('neuron');
                     circle.setAttribute('data-active', 'true');
                     
                     g.appendChild(circle);
                     svg.appendChild(g);
                     
                     neurons[layerIndex].push({
                         element: circle,
                         x: x,
                         y: y,
                         active: true
                     });
                 }
             });
             
             // Create connections
             for (let l = 0; l < layers.length - 1; l++) {
                 connections[l] = [];
                 for (let i = 0; i < neurons[l].length; i++) {
                     connections[l][i] = [];
                     for (let j = 0; j < neurons[l + 1].length; j++) {
                         let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                         line.setAttribute('x1', neurons[l][i].x);
                         line.setAttribute('y1', neurons[l][i].y);
                         line.setAttribute('x2', neurons[l + 1][j].x);
                         line.setAttribute('y2', neurons[l + 1][j].y);
                         line.classList.add('connection');
                         svg.insertBefore(line, svg.firstChild);
                         
                         connections[l][i][j] = {
                             element: line,
                             active: true
                         };
                     }
                 }
             }
             
             return {neurons, connections};
         }
         
         let dropoutNetwork = null;
         
         function applyDropout() {
             if (!dropoutNetwork) {
                 dropoutNetwork = createDropoutNetwork();
             }
             
             let dropoutRate = parseFloat(document.getElementById('dropout-slider').value);
             
             // Reset all neurons and connections
             dropoutNetwork.neurons.forEach((layer, layerIndex) => {
                 layer.forEach(neuron => {
                     neuron.active = true;
                     neuron.element.style.opacity = '1';
                     neuron.element.style.fill = '#3498db';
                 });
             });
             
             dropoutNetwork.connections.forEach(layer => {
                 layer.forEach(row => {
                     row.forEach(conn => {
                         conn.active = true;
                         conn.element.style.opacity = '1';
                     });
                 });
             });
             
             // Apply dropout to hidden layers only
             for (let l = 1; l < dropoutNetwork.neurons.length - 1; l++) {
                 dropoutNetwork.neurons[l].forEach(neuron => {
                     if (Math.random() < dropoutRate) {
                         neuron.active = false;
                         neuron.element.style.opacity = '0.2';
                         neuron.element.style.fill = '#95a5a6';
                         
                         // Disable connections from this neuron
                         if (l < dropoutNetwork.connections.length) {
                             let neuronIndex = dropoutNetwork.neurons[l].indexOf(neuron);
                             dropoutNetwork.connections[l][neuronIndex].forEach(conn => {
                                 conn.active = false;
                                 conn.element.style.opacity = '0.1';
                             });
                         }
                         
                         // Disable connections to this neuron
                         if (l > 0) {
                             dropoutNetwork.connections[l - 1].forEach(row => {
                                 let neuronIndex = dropoutNetwork.neurons[l].indexOf(neuron);
                                 if (row[neuronIndex]) {
                                     row[neuronIndex].active = false;
                                     row[neuronIndex].element.style.opacity = '0.1';
                                 }
                             });
                         }
                     }
                 });
             }
         }
         
         function resetDropout() {
             if (dropoutNetwork) {
                 dropoutNetwork.neurons.forEach(layer => {
                     layer.forEach(neuron => {
                         neuron.active = true;
                         neuron.element.style.opacity = '1';
                         neuron.element.style.fill = '#3498db';
                     });
                 });
                 
                 dropoutNetwork.connections.forEach(layer => {
                     layer.forEach(row => {
                         row.forEach(conn => {
                             conn.active = true;
                             conn.element.style.opacity = '1';
                         });
                     });
                 });
             }
         }

         function drawMiniNetwork(svg, type) {
             svg.innerHTML = '';
             
             if (type === 'feedforward') {
                 // Simple feedforward structure
                 let layers = [2, 3, 1];
                 let x_positions = [40, 90, 140];
                 
                 layers.forEach((count, layerIndex) => {
                     let x = x_positions[layerIndex];
                     let startY = 100 - (count * 30) / 2;
                     
                     for (let i = 0; i < count; i++) {
                         let y = startY + i * 30;
                         let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                         circle.setAttribute('cx', x);
                         circle.setAttribute('cy', y);
                         circle.setAttribute('r', 10);
                         circle.setAttribute('fill', '#3498db');
                         circle.setAttribute('stroke', '#2c3e50');
                         svg.appendChild(circle);
                         
                         // Draw connections to next layer
                         if (layerIndex < layers.length - 1) {
                             let nextCount = layers[layerIndex + 1];
                             let nextX = x_positions[layerIndex + 1];
                             let nextStartY = 100 - (nextCount * 30) / 2;
                             
                             for (let j = 0; j < nextCount; j++) {
                                 let nextY = nextStartY + j * 30;
                                 let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                                 line.setAttribute('x1', x);
                                 line.setAttribute('y1', y);
                                 line.setAttribute('x2', nextX);
                                 line.setAttribute('y2', nextY);
                                 line.setAttribute('stroke', '#95a5a6');
                                 line.setAttribute('stroke-width', '1');
                                 svg.insertBefore(line, svg.firstChild);
                             }
                         }
                     }
                 });
             } else if (type === 'cnn') {
                 // Convolutional layers representation
                 let rects = [
                     {x: 20, y: 60, width: 40, height: 80, fill: '#3498db'},
                     {x: 70, y: 70, width: 30, height: 60, fill: '#2980b9'},
                     {x: 110, y: 80, width: 20, height: 40, fill: '#1f618d'},
                     {x: 140, y: 90, width: 10, height: 20, fill: '#154360'}
                 ];
                 
                 rects.forEach((rect, i) => {
                     let r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                     r.setAttribute('x', rect.x);
                     r.setAttribute('y', rect.y);
                     r.setAttribute('width', rect.width);
                     r.setAttribute('height', rect.height);
                     r.setAttribute('fill', rect.fill);
                     r.setAttribute('stroke', '#2c3e50');
                     svg.appendChild(r);
                     
                     if (i < rects.length - 1) {
                         let arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                         arrow.setAttribute('d', `M ${rect.x + rect.width} ${rect.y + rect.height/2} L ${rects[i+1].x - 5} ${rects[i+1].y + rects[i+1].height/2}`);
                         arrow.setAttribute('stroke', '#95a5a6');
                         arrow.setAttribute('stroke-width', '2');
                         arrow.setAttribute('marker-end', 'url(#arrowhead)');
                         svg.appendChild(arrow);
                     }
                 });
             } else if (type === 'rnn') {
                 // Recurrent connection
                 let neurons = [
                     {x: 50, y: 100},
                     {x: 90, y: 100},
                     {x: 130, y: 100}
                 ];
                 
                 neurons.forEach((neuron, i) => {
                     let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                     circle.setAttribute('cx', neuron.x);
                     circle.setAttribute('cy', neuron.y);
                     circle.setAttribute('r', 15);
                     circle.setAttribute('fill', '#3498db');
                     circle.setAttribute('stroke', '#2c3e50');
                     svg.appendChild(circle);
                     
                     // Recurrent connection
                     let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                     path.setAttribute('d', `M ${neuron.x} ${neuron.y - 15} Q ${neuron.x} ${neuron.y - 40} ${neuron.x + 20} ${neuron.y - 20} Q ${neuron.x + 30} ${neuron.y} ${neuron.x + 15} ${neuron.y}`);
                     path.setAttribute('stroke', '#e74c3c');
                     path.setAttribute('stroke-width', '2');
                     path.setAttribute('fill', 'none');
                     path.setAttribute('marker-end', 'url(#arrowhead-red)');

                         let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');

                         line.setAttribute('y2', neurons[i+1].y);
                         line.setAttribute('stroke', '#95a5a6');
                         line.setAttribute('stroke-width', '2');
                         svg.appendChild(line);
                     }
                 });
             }

             ctx.strokeStyle = 'black';
             ctx.lineWidth = 2;
             ctx.beginPath();
             ctx.moveTo(200, 215);
             ctx.lineTo(200, 225);
             ctx.moveTo(200, 225);
             ctx.arc(190, 225, 10, 0, Math.PI/2);
             ctx.moveTo(200, 225);
             ctx.arc(210, 225, 10, Math.PI/2, Math.PI);
             ctx.stroke();
             
             // Ears
             ctx.fillStyle = '#8b4513';
             ctx.beginPath();
             ctx.moveTo(150, 150);
             ctx.lineTo(130, 120);
             ctx.lineTo(170, 140);
             ctx.closePath();
             ctx.fill();
             
             ctx.beginPath();
             ctx.moveTo(250, 150);
             ctx.lineTo(270, 120);
             ctx.lineTo(230, 140);
             ctx.closePath();
             ctx.fill();
         }
         
         function processImage() {
             // Simulate CNN processing
             let canvas = document.getElementById('image-canvas');
             let ctx = canvas.getContext('2d');
             
             // Create convolution effect
             let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
             let data = imageData.data;
             
             // Simple edge detection filter
             let output = ctx.createImageData(canvas.width, canvas.height);
             let outputData = output.data;
             
             for (let i = 0; i < data.length; i += 4) {
                 let gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                 outputData[i] = outputData[i+1] = outputData[i+2] = gray;
                 outputData[i+3] = data[i+3];
             }
             
             // Flash effect to show processing
             ctx.putImageData(output, 0, 0);
             
             setTimeout(() => {
                 ctx.putImageData(imageData, 0, 0);

         // Touch support for mobile
         function addTouchSupport() {
             let canvases = document.querySelectorAll('canvas');
             
             canvases.forEach(canvas => {
                 canvas.addEventListener('touchstart', function(e) {
                     let touch = e.touches[0];
                     let mouseEvent = new MouseEvent('mousedown', {
                         clientX: touch.clientX,
                         clientY: touch.clientY
                     });
                     canvas.dispatchEvent(mouseEvent);
                 });
                 
                 canvas.addEventListener('touchmove', function(e) {
                     let touch = e.touches[0];
                     let mouseEvent = new MouseEvent('mousemove', {
                         clientX: touch.clientX,
                         clientY: touch.clientY
                     });
                     canvas.dispatchEvent(mouseEvent);
                 });
                 
                 canvas.addEventListener('touchend', function(e) {
                     let mouseEvent = new MouseEvent('mouseup', {});
                     canvas.dispatchEvent(mouseEvent);
                 });
             });
         }
         
         addTouchSupport();
