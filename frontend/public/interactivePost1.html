<html><head></head><body><div class="content-block code-block" data-blockid="8c5d22f0-d720-446e-8966-6c062b05aa19" data-code="<!DOCTYPE html>
 <html lang=&quot;en&quot;>
 <head>
     <meta charset=&quot;UTF-8&quot;>
     <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
     <title>Chatbot Assistant</title>
     <style>
         :root {
             --border: #3e3f41;
             --darkest: #0f0f0f;
             --dark: #232527;
             --light: #737484;
             --lightest: #dddddd;
         }
 
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
         }
 
         body {
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
             background-color: var(--darkest);
             color: var(--lightest);
             height: 100vh;
             overflow: hidden;
         }
 
         .chat-container {
             display: flex;
             flex-direction: column;
             height: 100vh;
             margin: 0 auto;
             border-left: 1px solid var(--border);
             border-right: 1px solid var(--border);
         }
 
         .chat-header {
             background-color: var(--dark);
             padding: 1rem;
             border-bottom: 1px solid var(--border);
             text-align: center;
         }
 
         .chat-header h1 {
             font-size: 1.2rem;
             font-weight: 600;
         }
 
         .chat-messages {
             flex: 1;
             overflow-y: auto;
             padding: 1rem;
             background-color: var(--darkest);
         }
 
         .message {
             margin-bottom: 1rem;
             padding: 0.75rem 1rem;
             border-radius: 8px;
             max-width: 80%;
             word-wrap: break-word;
         }
 
         .user-message {
             background-color: var(--dark);
             margin-left: auto;
             border: 1px solid var(--border);
         }
 
         .bot-message {
             background-color: var(--dark);
             margin-right: auto;
             border: 1px solid var(--border);
             border-left: 3px solid var(--light);
         }
 
         .chat-options {
             background-color: var(--dark);
             border-top: 1px solid var(--border);
             padding: 1rem;
         }
 
         .options-grid {
             display: grid;
             grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
             gap: 0.75rem;
             margin-bottom: 1rem;
         }
 
         .option-button {
             background-color: var(--darkest);
             color: var(--lightest);
             border: 1px solid var(--border);
             padding: 0.75rem 1rem;
             border-radius: 6px;
             cursor: pointer;
             transition: all 0.2s ease;
             font-size: 0.9rem;
             text-align: left;
         }
 
         .option-button:hover {
             background-color: var(--light);
             color: var(--darkest);
             transform: translateY(-1px);
         }
 
         .option-button:active {
             transform: translateY(0);
         }
 
         .typing-indicator {
             display: none;
             padding: 0.75rem 1rem;
             margin-bottom: 1rem;
             background-color: var(--dark);
             border: 1px solid var(--border);
             border-left: 3px solid var(--light);
             border-radius: 8px;
             max-width: 80%;
             margin-right: auto;
         }
 
         .typing-dots {
             display: inline-flex;
             gap: 4px;
         }
 
         .typing-dot {
             width: 6px;
             height: 6px;
             border-radius: 50%;
             background-color: var(--light);
             animation: typing 1.4s infinite ease-in-out;
         }
 
         .typing-dot:nth-child(1) { animation-delay: -0.32s; }
         .typing-dot:nth-child(2) { animation-delay: -0.16s; }
 
         @keyframes typing {
             0%, 80%, 100% {
                 transform: scale(0.8);
                 opacity: 0.5;
             }
             40% {
                 transform: scale(1);
                 opacity: 1;
             }
         }
 
         .welcome-message {
             text-align: center;
             color: var(--light);
             padding: 2rem;
             font-style: italic;
         }
 
         /* Custom scrollbar */
         .chat-messages::-webkit-scrollbar {
             width: 6px;
         }
 
         .chat-messages::-webkit-scrollbar-track {
             background: var(--darkest);
         }
 
         .chat-messages::-webkit-scrollbar-thumb {
             background: var(--border);
             border-radius: 3px;
         }
 
         .chat-messages::-webkit-scrollbar-thumb:hover {
             background: var(--light);
         }
     </style>
 </head>
 <body>
     <div class=&quot;chat-container&quot;>
         <div class=&quot;chat-header&quot;>
             <h1>This is a post you can chat with</h1>
         </div>
         
         <div class=&quot;chat-messages&quot; id=&quot;chatMessages&quot;>
             <div class=&quot;welcome-message&quot;>
                 Welcome! Choose an option below to start chatting.
             </div>
         </div>
 
         <div class=&quot;typing-indicator&quot; id=&quot;typingIndicator&quot;>
             <span class=&quot;typing-dots&quot;>
                 <span class=&quot;typing-dot&quot;></span>
                 <span class=&quot;typing-dot&quot;></span>
                 <span class=&quot;typing-dot&quot;></span>
             </span>
             <span style=&quot;margin-left: 8px; color: var(--light);&quot;>Assistant is typing...</span>
         </div>
 
         <div class=&quot;chat-options&quot;>
             <div class=&quot;options-grid&quot;>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('greeting')&quot;>
                     Say Hello
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('help')&quot;>
                     Get Help
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('weather')&quot;>
                     Ask About Weather
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('joke')&quot;>
                     Tell Me a Joke
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('time')&quot;>
                     What Time Is It?
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('fact')&quot;>
                     Share a Fun Fact
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('goodbye')&quot;>
                     Say Goodbye
                 </button>
                 <button class=&quot;option-button&quot; onclick=&quot;sendMessage('about')&quot;>
                     About This Bot
                 </button>
             </div>
         </div>
     </div>
 
     <script>
         // Hardcoded responses for different message types
         const responses = {
             greeting: [
                 &quot;Hello there! It's great to meet you! How can I assist you today?&quot;,
                 &quot;Hi! Welcome to our chat. What would you like to talk about?&quot;,
                 &quot;Hey! Thanks for stopping by. I'm here to help with whatever you need!&quot;
             ],
             help: [
                 &quot;I'm here to help! You can choose from the options below to:\n• Get a greeting\n• Ask about weather\n• Hear a joke\n• Learn fun facts\n• And more!&quot;,
                 &quot;Need assistance? Just click on any of the buttons below and I'll respond accordingly. I have responses for greetings, jokes, weather, time, and more!&quot;,
                 &quot;I'm a simple chatbot with predefined responses. Choose any option below to see what I can do!&quot;
             ],
             weather: [
                 &quot;It's a beautiful day with partly cloudy skies and a pleasant 72°F! Perfect weather for a walk.&quot;,
                 &quot;The weather is sunny and bright today! Temperature is around 75°F with a gentle breeze.&quot;,
                 &quot;Looks like we might have some light rain later, but it's currently 68°F and partly cloudy.&quot;
             ],
             joke: [
                 &quot;Why don't scientists trust atoms? Because they make up everything!&quot;,
                 &quot;I told my wife she was drawing her eyebrows too high. She looked surprised!&quot;,
                 &quot;Why did the scarecrow win an award? He was outstanding in his field!&quot;,
                 &quot;What do you call a fake noodle? An impasta!&quot;
             ],
             time: [
                 &quot;The current time is &quot; + new Date().toLocaleTimeString() + &quot;!&quot;,
                 &quot;Right now it's &quot; + new Date().toLocaleTimeString() + &quot;. Time flies when you're having fun!&quot;,
                 &quot;The time is &quot; + new Date().toLocaleTimeString() + &quot;. Hope you're having a great day!&quot;
             ],
             fact: [
                 &quot;Did you know that octopuses have three hearts and blue blood? Amazing creatures!&quot;,
                 &quot;Fun fact: Honey never spoils! Archaeologists have found 3000-year-old honey that's still edible.&quot;,
                 &quot;A group of flamingos is called a 'flamboyance'! How fitting!&quot;,
                 &quot;The Moon is gradually moving away from Earth at about 3.8 cm per year!&quot;
             ],
             goodbye: [
                 &quot;Goodbye! Thanks for chatting with me. Have a wonderful day!&quot;,
                 &quot;See you later! It was great talking with you. Take care!&quot;,
                 &quot;Farewell! Hope to chat with you again soon. Have an amazing day!&quot;
             ],
             about: [
                 &quot;I'm a simple chatbot built with HTML, CSS, and JavaScript! I have hardcoded responses for different topics and use a sleek dark theme.&quot;,
                 &quot;This chatbot is a demonstration of a basic conversational interface. I respond to predefined options with various friendly messages!&quot;,
                 &quot;I'm powered by vanilla JavaScript with predefined responses. My goal is to show how you can create a simple, interactive chatbot interface!&quot;
             ]
         };
 
         function addMessage(text, isUser = false) {
             const messagesContainer = document.getElementById('chatMessages');
             const messageDiv = document.createElement('div');
             messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
             messageDiv.textContent = text;
             messagesContainer.appendChild(messageDiv);
             
             // Auto-scroll to bottom
             messagesContainer.scrollTop = messagesContainer.scrollHeight;
         }
 
         function showTyping() {
             document.getElementById('typingIndicator').style.display = 'block';
             const messagesContainer = document.getElementById('chatMessages');
             messagesContainer.scrollTop = messagesContainer.scrollHeight;
         }
 
         function hideTyping() {
             document.getElementById('typingIndicator').style.display = 'none';
         }
 
         function getRandomResponse(category) {
             const categoryResponses = responses[category];
             return categoryResponses[Math.floor(Math.random() * categoryResponses.length)];
         }
 
         function sendMessage(messageType) {
             // Map message types to user-friendly text
             const userMessages = {
                 greeting: &quot;Hello!&quot;,
                 help: &quot;I need help&quot;,
                 weather: &quot;What's the weather like?&quot;,
                 joke: &quot;Tell me a joke&quot;,
                 time: &quot;What time is it?&quot;,
                 fact: &quot;Share a fun fact&quot;,
                 goodbye: &quot;Goodbye&quot;,
                 about: &quot;Tell me about this bot&quot;
             };
 
             // Add user message
             addMessage(userMessages[messageType], true);
 
             // Show typing indicator
             showTyping();
 
             // Simulate bot response delay
             setTimeout(() => {
                 hideTyping();
                 const response = getRandomResponse(messageType);
                 addMessage(response, false);
             }, Math.random() * 1000 + 800); // Random delay between 800-1800ms
         }
 
         // Remove welcome message on first interaction
         let firstInteraction = true;
         const originalSendMessage = sendMessage;
         sendMessage = function(messageType) {
             if (firstInteraction) {
                 const welcomeMsg = document.querySelector('.welcome-message');
                 if (welcomeMsg) welcomeMsg.remove();
                 firstInteraction = false;
             }
             originalSendMessage(messageType);
         };
     </script>
 </body>
 </html>"></div></body></html>
